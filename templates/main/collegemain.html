<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amrit Helper - College AI</title>
    <link rel="stylesheet" href="/static/main/collegemainstyle.css">
    <link rel="icon" href="/static/images/atma.jpg" type="image/x-icon">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #1e1e2f;
            color: #ffffff;
            text-align: center;
        }

        /* Header Section */
        header {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            padding: 20px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        .slogan {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Button Section */
        .buttons {
            margin: 40px auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 250px;
            transition: transform 0.3s ease-in-out;
            box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 6px 15px rgba(255, 255, 255, 0.2);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .card button {
            background: #ff5733;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .card button:hover {
            background: #c0392b;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            padding: 10px;
            margin-top: 40px;
        }

        /* Time Display */
        #time {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>COLLEGE HELPER AI AMRIT</h1>
        <p class="slogan">Your Smart College Companion</p>
        <div id="time"></div>
    </header>

    <main>
        <section class="buttons">
            <div class="card">
                <img src="/static/images/clg.jpg" alt="College Enquiry">
                <button onclick="window.location.href='/collegeEnquiry'">College Enquiry</button>
            </div>

            <div class="card">
                <img src="/static/images/student1.jpg" alt="Classroom">
                <button onclick="window.location.href='/classroom'">Classroom</button>
            </div>

            <div class="card">
                <img src="/static/images/student.jpg" alt="Leave">
                <button onclick="window.location.href='/leave'">Leave</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Amrit Helper. All rights reserved.</p>
    </footer>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const period = hours >= 12 ? 'PM' : 'AM';

            const timeString = `${(hours % 12 || 12)}:${minutes}:${seconds} ${period}`;
            document.getElementById("time").textContent = timeString;

            setTimeout(updateTime, 1000);
        }
        updateTime();
    </script>
</body>
</html>
