{% extends 'classroom/base.html' %}

{% block content %}

<div class="login-page">
    <div class="overlay"></div>
    <div class="signup-box">
        <h1 class="text-white">Sign Up</h1>
        <p class="text-light">Choose your role to continue</p>
        
        <a href="{{ url_for('student_signup') }}" class="signup-option student">
            <i class="fas fa-user-graduate"></i> I'm a Student
        </a>
        
        <a href="{{ url_for('teacher_signup') }}" class="signup-option teacher">
            <i class="fas fa-chalkboard-teacher"></i> I'm a Teacher
        </a>
    </div>
</div>

<!-- Custom Styling -->
<style>
/* Background Image */
.login-page {
    position: relative;
    width: 100%;
    height: 100vh;
    background: url("{{ url_for('static', filename='images/login-background.PNG') }}") no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Dark Overlay */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
}

/* Signup Box with Glassmorphism */
.signup-box {
    position: absolute;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
    max-width: 350px;
    width: 90%;
}

/* Signup Options */
.signup-option {
    display: block;
    padding: 12px;
    margin: 10px 0;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    text-decoration: none;
    transition: 0.3s ease;
    text-align: center;
}

/* Student Option */
.student {
    background: rgba(52, 152, 219, 0.7);
    color: white;
}

.student:hover {
    background: rgba(41, 128, 185, 0.9);
}

/* Teacher Option */
.teacher {
    background: rgba(46, 204, 113, 0.7);
    color: white;
}

.teacher:hover {
    background: rgba(39, 174, 96, 0.9);
}

/* Icons */
.signup-option i {
    margin-right: 8px;
}

</style>

{% endblock %}
