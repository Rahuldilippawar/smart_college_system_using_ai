{% extends 'classroom/base.html' %}
{% block content %}

<div class="profile">
  <img src="{{ url_for('static', filename='images/profile-background-3.PNG') }}" alt="">
  <div class="profile-box">
    {% if student.student_profile_pic %}
      <img src="{{ student.student_profile_pic }}">
    {% else %}
      <img src="{{ url_for('static', filename='images/login-avatar.PNG') }}" alt="">
    {% endif %}
    <div class="profile-details">
      <h1>{{ student.name }}</h1>
      <br>
      <p><i class="far fa-user"></i> Username: {{ student.user.username }}</p>
      <p><i class="fal fa-user-tag"></i> Roll No.: {{ student.roll_no }}</p>
      <p><i class="far fa-phone"></i> Phone: {{ student.phone }}</p>
      <p><i class="far fa-envelope-open-text"></i> Email ID: {{ student.email }}</p>
      <a href="{{ url_for('student_update', pk=student.id) }}">

        <p class="edit-button">Edit Profile</p>
      </a>
    </div>
  </div>
</div>

{% endblock %}
