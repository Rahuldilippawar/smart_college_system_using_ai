{% extends 'classroom/base.html' %}
{% block content %}

<div class="profile">
  <img src="{{ url_for('static', filename='images/profile-background-3.PNG') }}" alt="">

  <div class="profile-box">
    {% if teacher.teacher_profile_pic %}
    <img src="{{ url_for('static', filename=teacher.teacher_profile_pic) }}" alt="">
    {% else %}
    <img src="{{ url_for('static', filename='images/default.jpg') }}" alt="">
    {% endif %}

    <div class="profile-details">
      <h1>{{ teacher.name }}</h1>
      <br>
      <p><i class="far fa-user"></i> Username: {{ teacher.email }}</p>
      <p><i class="fas fa-book"></i> Subject Name: {{ teacher.subject_name }}</p>
      <p><i class="far fa-phone"></i> Phone: {{ teacher.phone }}</p>
      <p><i class="far fa-envelope-open-text"></i> Email ID: {{ teacher.email }}</p>
      <a href="{{ url_for('teacher_update', pk=teacher.id) }}"><p class="edit-button">Edit profile</p></a>
    </div>
  </div>
</div>

{% endblock %}
